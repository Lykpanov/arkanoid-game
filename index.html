<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Арканоид в Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            background-color: #111;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: block;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Игровые параметры
    let score = 0;
    let lives = 3;

    // Мяч
    let x = canvas.width / 2;
    let y = canvas.height - 150;
    let dx = 3;
    let dy = -3;
    const ballRadius = 6;

    // Платформа (ракетка)
    const paddleHeight = 14;
    const paddleWidth = 90;
    let paddleX = (canvas.width - paddleWidth) / 2;

    // Настройки блоков и рамки
    const brickRowCount = 15;
    const brickColumnCount = 17;
    const brickWidth = 20;
    const brickHeight = 10;
    const brickPadding = 1;
    const brickOffsetTop = 50;
    const brickOffsetLeft = 23;

    // Создание сетки блоков
    let bricks = [];
    for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
            let isBorder = (c === 0 || c === brickColumnCount - 1 || r === 0 || r === brickRowCount - 1);
            
            // Проход вверху (по центру)
            if (r === 0 && c >= 7 && c <= 9) {
                isBorder = false; 
            }
            
            // Проход внизу (ровно один блок по центру, c === 8)
            if (r === brickRowCount - 1 && c === 8) {
                isBorder = false;
            }

            bricks[c][r] = { x: 0, y: 0, status: isBorder ? 2 : 1 };
        }
    }

    // Управление пальцем и мышкой
    function handleMove(clientX) {
        const rect = canvas.getBoundingClientRect();
        let relativeX = clientX - rect.left;
        let scaleX = canvas.width / rect.width;
        let canvasX = relativeX * scaleX;
        
        paddleX = canvasX - paddleWidth / 2;
        
        if (paddleX < 0) paddleX = 0;
        if (paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
    }

    canvas.addEventListener("mousemove", (e) => {
        handleMove(e.clientX);
    });

    canvas.addEventListener("touchmove", (e) => {
        if (e.touches.length > 0) {
            handleMove(e.touches[0].clientX);
        }
    }, { passive: true });

    // Столкновение мяча с блоками
    function collisionDetection() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                let b = bricks[c][r];
                if (b.status > 0) {
                    if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                        dy = -dy;
                        if (b.status === 1) {
                            b.status = 0;
                            score += 10;
                        }
                    }
                }
            }
        }
    }

    function drawBall() {
        ctx.beginPath();
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.closePath();
    }

    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddleX, canvas.height - 40, paddleWidth, paddleHeight);
        ctx.fillStyle = "#ff6b4a";
        ctx.fill();
        ctx.closePath();
    }

    function drawBricks() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                bricks[c][r].x = brickX;
                bricks[c][r].y = brickY;
                
                if (bricks[c][r].status > 0) {
                    ctx.beginPath();
                    ctx.rect(brickX, brickY, brickWidth, brickHeight);
                    ctx.fillStyle = bricks[c][r].status === 2 ? "#555555" : "#e68a40";
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    function drawStats() {
        ctx.font = "14px Arial";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("Счет: " + score, 20, 25);
        ctx.fillText("Жизни: " + lives, canvas.width - 80, 25);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawBall();
        drawPaddle();
        drawStats();
        collisionDetection();

        // Отскок от стен слева/справа
        if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
            dx = -dx;
        }

        // Отскок сверху
        if (y + dy < ballRadius) {
            dy = -dy;
        } 
        // Проверка нижней границы и платформы
        else if (y + dy >= canvas.height - 40 - ballRadius) {
            if (x >= paddleX && x <= paddleX + paddleWidth && y <= canvas.height - 40 + paddleHeight) {
                dy = -Math.abs(dy); // Всегда отбиваем наверх
                
                let deltaX = x - (paddleX + paddleWidth / 2);
                dx = deltaX * 0.15;
                
                y = canvas.height - 40 - ballRadius; // Защита от застревания в ракетке
            } else if (y + dy > canvas.height - ballRadius) {
                lives--;
                if (!lives) {
                    alert("Игра окончена! Счёт: " + score);
                    document.location.reload();
                } else {
                    x = canvas.width / 2;
                    y = canvas.height - 150;
                    dx = 3;
                    dy = -3;
                    paddleX = (canvas.width - paddleWidth) / 2;
                }
            }
        }

        x += dx;
        y += dy;

        requestAnimationFrame(draw);
    }

    draw();
</script>

</body>
</html>
