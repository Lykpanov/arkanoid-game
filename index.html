<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Танчики — Джойстик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a1a;
            touch-action: none;
            font-family: 'Courier New', monospace;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #0a0a1a;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: block;
            image-rendering: pixelated;
            touch-action: none;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            color: #00ffcc;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 255, 200, 0.5);
            pointer-events: none;
            z-index: 10;
            flex-wrap: wrap;
            gap: 4px;
        }
        #hud span {
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 200, 0.2);
            backdrop-filter: blur(4px);
        }
        #hud .lives {
            color: #ff4466;
        }
        #restartBtn {
            pointer-events: auto;
            background: #e94560;
            border: none;
            color: white;
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 0 20px #e9456088;
            touch-action: manipulation;
        }
        #restartBtn:active {
            transform: scale(0.92);
        }

        /* Джойстик */
        #joystickZone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 255, 255, 0.12);
            touch-action: none;
            z-index: 20;
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.08);
        }
        #joystickKnob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ccff, #0077aa);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            transition: none;
        }

        /* Кнопка огня */
        #fireBtn {
            position: absolute;
            bottom: 45px;
            right: 30px;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff4444, #aa1111);
            border: 3px solid rgba(255, 80, 80, 0.4);
            color: white;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            z-index: 20;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.25);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        #fireBtn:active {
            transform: scale(0.88);
        }

        @media (max-width: 500px) {
            #joystickZone { width: 100px; height: 100px; bottom: 20px; left: 20px; }
            #joystickKnob { width: 40px; height: 40px; }
            #fireBtn { width: 60px; height: 60px; bottom: 30px; right: 20px; font-size: 20px; }
            #hud { font-size: 12px; top: 6px; padding: 0 10px; }
            #hud span { padding: 2px 8px; }
        }
        @media (max-width: 400px) {
            #joystickZone { width: 80px; height: 80px; bottom: 15px; left: 15px; }
            #joystickKnob { width: 32px; height: 32px; }
            #fireBtn { width: 50px; height: 50px; bottom: 22px; right: 15px; font-size: 16px; }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
        <span>🏆 <span id="scoreDisplay">0</span></span>
        <span>🌊 <span id="waveDisplay">1</span></span>
        <span class="lives">❤️ <span id="livesDisplay">3</span></span>
        <button id="restartBtn">↺</button>
    </div>

    <!-- Джойстик -->
    <div id="joystickZone">
        <div id="joystickKnob"></div>
    </div>

    <!-- Кнопка огня -->
    <div id="fireBtn">🔥</div>
</div>

<script>
    // =============================================================
    //  ТАНЧИКИ — Полная игра с джойстиком
    // =============================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const waveDisplay = document.getElementById('waveDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const restartBtn = document.getElementById('restartBtn');

    // ---------- РАЗМЕРЫ ----------
    let W, H, TILE, COLS, ROWS, offsetX, offsetY;

    function resizeCanvas() {
        W = canvas.parentElement.clientWidth;
        H = canvas.parentElement.clientHeight;
        canvas.width = W;
        canvas.height = H;
        TILE = Math.min(W, H) / 20;
        COLS = Math.floor(W / TILE);
        ROWS = Math.floor(H / TILE);
        if (COLS > 20) COLS = 20;
        if (ROWS > 20) ROWS = 20;
        TILE = Math.min(W / COLS, H / ROWS);
        offsetX = (W - COLS * TILE) / 2;
        offsetY = (H - ROWS * TILE) / 2;
    }

    // ---------- СОСТОЯНИЕ ----------
    let gameOver = false;
    let winMessage = '';
    let score = 0;
    let wave = 1;
    let lives = 3;
    let enemiesKilledInWave = 0;
    let enemiesPerWave = 4;
    let enemySpawnTimer = 0;
    let maxEnemiesAlive = 4;

    let map = [];
    let player = null;
    let enemies = [];
    let bullets = [];
    let particles = [];

    // Джойстик
    let joyX = 0, joyY = 0;
    let isDragging = false;
    let firePressed = false;

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    function initGame() {
        gameOver = false;
        winMessage = '';
        score = 0;
        wave = 1;
        lives = 3;
        enemiesKilledInWave = 0;
        enemiesPerWave = 4;
        enemySpawnTimer = 0;
        maxEnemiesAlive = 4;
        bullets = [];
        enemies = [];
        particles = [];

        resizeCanvas();
        generateMap();
        spawnPlayer();
        updateUI();

        // Спавн первых врагов
        setTimeout(() => {
            for (let i = 0; i < 3; i++) {
                setTimeout(spawnEnemy, i * 400);
            }
        }, 500);
    }

    function generateMap() {
        map = [];
        for (let r = 0; r < ROWS; r++) {
            map[r] = [];
            for (let c = 0; c < COLS; c++) {
                if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) {
                    map[r][c] = 2;
                } else {
                    map[r][c] = 0;
                }
            }
        }

        for (let i = 0; i < 40; i++) {
            let r = Math.floor(Math.random() * (ROWS - 4)) + 2;
            let c = Math.floor(Math.random() * (COLS - 4)) + 2;
            if (map[r][c] === 0 && !(r < 4 && c < 4)) {
                map[r][c] = Math.random() > 0.5 ? 1 : 2;
            }
        }

        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                if (r < ROWS && c < COLS) map[r][c] = 0;
            }
        }
    }

    function spawnPlayer() {
        player = {
            x: 2 * TILE + TILE / 2,
            y: 2 * TILE + TILE / 2,
            w: TILE - 4,
            h: TILE - 4,
            dir: 1,
            speed: 2.5,
            cooldown: 0,
            alive: true,
            color: '#00aaff',
            invincible: 60
        };
    }

    function respawnPlayer() {
        if (lives <= 0) {
            gameOver = true;
            winMessage = '💀 Игра окончена!';
            return;
        }
        lives--;
        spawnPlayer();
        player.invincible = 90;
        updateUI();
        for (let i = 0; i < 20; i++) {
            particles.push(createParticle(player.x, player.y, '#00aaff'));
        }
    }

    // ---------- ВСПОМОГАТЕЛЬНЫЕ ----------
    function isSolid(col, row) {
        if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return true;
        return map[row][col] === 2;
    }

    function canMove(x, y, w, h, excludeObj) {
        if (x - w / 2 < 0 || x + w / 2 > COLS * TILE || y - h / 2 < 0 || y + h / 2 > ROWS * TILE) return false;

        let left = Math.floor((x - w / 2) / TILE);
        let right = Math.floor((x + w / 2 - 1) / TILE);
        let top = Math.floor((y - h / 2) / TILE);
        let bottom = Math.floor((y + h / 2 - 1) / TILE);

        for (let r = top; r <= bottom; r++) {
            for (let c = left; c <= right; c++) {
                if (isSolid(c, r)) return false;
                if (map[r] && map[r][c] === 1) return false;
            }
        }

        for (let e of enemies) {
            if (e === excludeObj || !e.alive) continue;
            if (Math.abs(e.x - x) < (e.w / 2 + w / 2) && Math.abs(e.y - y) < (e.h / 2 + h / 2)) {
                return false;
            }
        }
        return true;
    }

    function moveEntity(entity, dx, dy, exclude) {
        let nx = entity.x + dx;
        let ny = entity.y + dy;
        if (canMove(nx, ny, entity.w, entity.h, exclude)) {
            entity.x = nx;
            entity.y = ny;
            return true;
        }
        if (dx !== 0 && canMove(nx, entity.y, entity.w, entity.h, exclude)) {
            entity.x = nx;
            return true;
        }
        if (dy !== 0 && canMove(entity.x, ny, entity.w, entity.h, exclude)) {
            entity.y = ny;
            return true;
        }
        return false;
    }

    function createParticle(x, y, color) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 1 + Math.random() * 3;
        return {
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 20 + Math.random() * 20,
            maxLife: 40,
            size: 3 + Math.random() * 5,
            color: color || '#ff8800'
        };
    }

    function shoot(entity) {
        if (entity.cooldown > 0) return;
        entity.cooldown = 12;
        let dx = 0,
            dy = 0;
        if (entity.dir === 0) dy = -1;
        else if (entity.dir === 1) dx = 1;
        else if (entity.dir === 2) dy = 1;
        else if (entity.dir === 3) dx = -1;

        bullets.push({
            x: entity.x + dx * 18,
            y: entity.y + dy * 18,
            w: 6,
            h: 6,
            dx: dx * 6,
            dy: dy * 6,
            owner: entity,
            alive: true,
            life: 80
        });
    }

    function spawnEnemy() {
        if (enemies.filter(e => e.alive).length >= maxEnemiesAlive) return;

        let spawnPoints = [];
        for (let r = 1; r < ROWS - 1; r++) {
            for (let c = 1; c < COLS - 1; c++) {
                if ((r < 3 && c < 3) || (r > ROWS - 4 && c > COLS - 4)) continue;
                if (map[r][c] === 0) {
                    let border = (r === 1 || r === ROWS - 2 || c === 1 || c === COLS - 2);
                    if (border && Math.random() < 0.3) {
                        spawnPoints.push([r, c]);
                    }
                }
            }
        }

        if (spawnPoints.length === 0) {
            let corners = [
                [1, 1],
                [1, COLS - 2],
                [ROWS - 2, 1],
                [ROWS - 2, COLS - 2]
            ];
            for (let [r, c] of corners) {
                if (r < ROWS && c < COLS && map[r][c] === 0) spawnPoints.push([r, c]);
            }
        }

        let available = spawnPoints.filter(([r, c]) => {
            let occ = enemies.some(e => e.alive && Math.abs(e.x - c * TILE) < TILE && Math.abs(e.y - r * TILE) < TILE);
            return !occ;
        });

        if (available.length === 0) return;
        let [r, c] = available[Math.floor(Math.random() * available.length)];

        let enemy = {
            x: c * TILE + TILE / 2,
            y: r * TILE + TILE / 2,
            w: TILE - 4,
            h: TILE - 4,
            dir: Math.floor(Math.random() * 4),
            speed: 0.7 + wave * 0.08,
            cooldown: 0,
            alive: true,
            color: '#ffaa00',
            hp: 1,
            aiTimer: 30 + Math.floor(Math.random() * 40)
        };
        enemies.push(enemy);
    }

    // ---------- ОБНОВЛЕНИЕ ----------
    function update() {
        if (gameOver) return;

        // ----- ИГРОК -----
        if (player && player.alive) {
            if (player.cooldown > 0) player.cooldown--;
            if (player.invincible > 0) player.invincible--;

            let dx = 0,
                dy = 0;
            let mag = Math.hypot(joyX, joyY);
            if (mag > 0.15) {
                let normX = joyX / mag;
                let normY = joyY / mag;
                dx = normX * player.speed;
                dy = normY * player.speed;

                if (Math.abs(normX) > Math.abs(normY)) {
                    player.dir = normX > 0 ? 1 : 3;
                } else {
                    player.dir = normY > 0 ? 2 : 0;
                }
            }

            if (dx !== 0 || dy !== 0) {
                moveEntity(player, dx, dy, null);
            }

            if (firePressed) {
                shoot(player);
            }
        }

        // ----- ВРАГИ -----
        for (let enemy of enemies) {
            if (!enemy.alive) continue;
            if (enemy.cooldown > 0) enemy.cooldown--;
            enemy.aiTimer--;

            let target = player && player.alive ? player : null;
            if (target) {
                let dist = Math.hypot(target.x - enemy.x, target.y - enemy.y);

                if (enemy.aiTimer <= 0) {
                    if (dist > 60) {
                        let angle = Math.atan2(target.y - enemy.y, target.x - enemy.x);
                        let dx = 0,
                            dy = 0;
                        if (Math.abs(angle) < Math.PI / 4) { dx = enemy.speed;
                            enemy.dir = 1; } else if (Math.abs(angle) > 3 * Math.PI / 4) { dx = -enemy.speed;
                            enemy.dir = 3; } else if (angle < 0) { dy = -enemy.speed;
                            enemy.dir = 0; } else { dy = enemy.speed;
                            enemy.dir = 2; }
                        moveEntity(enemy, dx, dy, null);
                    } else {
                        if (enemy.cooldown === 0) shoot(enemy);
                        if (Math.random() < 0.03) {
                            enemy.dir = Math.floor(Math.random() * 4);
                        }
                        let dx = 0,
                            dy = 0;
                        if (enemy.dir === 0) dy = -enemy.speed * 0.5;
                        else if (enemy.dir === 1) dx = enemy.speed * 0.5;
                        else if (enemy.dir === 2) dy = enemy.speed * 0.5;
                        else if (enemy.dir === 3) dx = -enemy.speed * 0.5;
                        moveEntity(enemy, dx, dy, null);
                    }
                    enemy.aiTimer = 20 + Math.floor(Math.random() * 30);
                }
            } else {
                if (enemy.aiTimer <= 0) {
                    enemy.dir = Math.floor(Math.random() * 4);
                    enemy.aiTimer = 30 + Math.floor(Math.random() * 40);
                }
                let dx = 0,
                    dy = 0;
                if (enemy.dir === 0) dy = -enemy.speed;
                else if (enemy.dir === 1) dx = enemy.speed;
                else if (enemy.dir === 2) dy = enemy.speed;
                else if (enemy.dir === 3) dx = -enemy.speed;
                moveEntity(enemy, dx, dy, null);
                enemy.aiTimer--;
            }
        }

        // ----- ПУЛИ -----
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            if (!b.alive) { bullets.splice(i, 1); continue; }
            b.x += b.dx;
            b.y += b.dy;
            b.life--;

            if (b.x < 0 || b.x > COLS * TILE || b.y < 0 || b.y > ROWS * TILE || b.life <= 0) {
                b.alive = false;
                bullets.splice(i, 1);
                continue;
            }

            let col = Math.floor(b.x / TILE);
            let row = Math.floor(b.y / TILE);
            if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
                if (map[row][col] === 1) {
                    map[row][col] = 0;
                    for (let p = 0; p < 8; p++) {
                        particles.push(createParticle(b.x, b.y, '#b5651d'));
                    }
                    b.alive = false;
                    bullets.splice(i, 1);
                    continue;
                }
                if (map[row][col] === 2) {
                    b.alive = false;
                    bullets.splice(i, 1);
                    continue;
                }
            }

            // Попадание в игрока
            if (b.owner !== player && player && player.alive) {
                if (Math.abs(player.x - b.x) < (player.w / 2 + b.w / 2) && Math.abs(player.y - b.y) < (player.h / 2 + b.h / 2)) {
                    if (player.invincible <= 0) {
                        for (let p = 0; p < 15; p++) {
                            particles.push(createParticle(player.x, player.y, '#00aaff'));
                        }
                        player.alive = false;
                        b.alive = false;
                        bullets.splice(i, 1);
                        respawnPlayer();
                        continue;
                    }
                }
            }

            // Попадание во врагов
            let hit = false;
            for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                if (!e.alive || e === b.owner) continue;
                if (Math.abs(e.x - b.x) < (e.w / 2 + b.w / 2) && Math.abs(e.y - b.y) < (e.h / 2 + b.h / 2)) {
                    e.alive = false;
                    b.alive = false;
                    hit = true;
                    score += 10 + wave * 2;
                    enemiesKilledInWave++;
                    for (let p = 0; p < 20; p++) {
                        particles.push(createParticle(e.x, e.y, '#ffaa00'));
                    }
                    bullets.splice(i, 1);
                    enemies.splice(j, 1);
                    updateUI();

                    if (enemiesKilledInWave >= enemiesPerWave) {
                        wave++;
                        enemiesKilledInWave = 0;
                        enemiesPerWave = 3 + wave * 1;
                        maxEnemiesAlive = Math.min(3 + Math.floor(wave / 2), 10);
                        updateUI();
                        winMessage = `🌊 Волна ${wave}!`;
                        setTimeout(() => { if (!gameOver) winMessage = ''; }, 1500);
                        for (let k = 0; k < Math.min(3, maxEnemiesAlive); k++) {
                            setTimeout(spawnEnemy, k * 300);
                        }
                    } else {
                        setTimeout(spawnEnemy, 500 + Math.random() * 500);
                    }
                    break;
                }
            }
            if (hit) continue;
        }

        // ----- ЧАСТИЦЫ -----
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.97;
            p.vy *= 0.97;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // ----- СПАВН ВРАГОВ -----
        if (!gameOver && enemies.filter(e => e.alive).length < maxEnemiesAlive) {
            enemySpawnTimer--;
            if (enemySpawnTimer <= 0) {
                spawnEnemy();
                enemySpawnTimer = 60 + Math.floor(Math.random() * 60);
            }
        } else if (enemySpawnTimer <= 0) {
            enemySpawnTimer = 30;
        }

        updateUI();
    }

    // ---------- ОТРИСОВКА ----------
    function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.translate(offsetX, offsetY);

        // Карта
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let v = map[r][c];
                let x = c * TILE,
                    y = r * TILE;
                if (v === 1) {
                    ctx.fillStyle = '#b5651d';
                    ctx.fillRect(x, y, TILE, TILE);
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(x + 4, y + 4, 6, 6);
                    ctx.fillRect(x + 15, y + 4, 6, 6);
                    ctx.fillRect(x + 4, y + 15, 6, 6);
                    ctx.fillRect(x + 15, y + 15, 6, 6);
                } else if (v === 2) {
                    ctx.fillStyle = '#555';
                    ctx.fillRect(x, y, TILE, TILE);
                    ctx.fillStyle = '#777';
                    ctx.fillRect(x + 2, y + 2, 8, 8);
                    ctx.fillRect(x + 15, y + 2, 8, 8);
                    ctx.fillRect(x + 2, y + 15, 8, 8);
                    ctx.fillRect(x + 15, y + 15, 8, 8);
                }
            }
        }

        // Частицы
        for (let p of particles) {
            let alpha = p.life / p.maxLife;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 10;
            ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;

        // Враги
        for (let e of enemies) {
            if (!e.alive) continue;
            drawTank(e.x, e.y, e.w, e.h, e.dir, e.color);
        }

        // Игрок
        if (player && player.alive) {
            let color = player.invincible > 0 && Math.floor(player.invincible / 5) % 2 === 0 ? '#88ddff' : '#00aaff';
            drawTank(player.x, player.y, player.w, player.h, player.dir, color);
        }

        // Пули
        for (let b of bullets) {
            ctx.fillStyle = '#ffff44';
            ctx.shadowColor = '#ffff00';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        ctx.restore();

        // Сообщения
        if (winMessage && !gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(W / 2 - 150, H / 2 - 30, 300, 60);
            ctx.fillStyle = '#00ffcc';
            ctx.font = 'bold 28px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 20;
            ctx.fillText(winMessage, W / 2, H / 2);
            ctx.shadowBlur = 0;
        }

        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(W / 2 - 180, H / 2 - 60, 360, 120);
            ctx.fillStyle = '#ff4444';
            ctx.font = 'bold 36px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 30;
            ctx.fillText(winMessage, W / 2, H / 2 - 10);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#aaa';
            ctx.font = '18px "Courier New", monospace';
            ctx.fillText('Нажмите ↺', W / 2, H / 2 + 45);
        }
    }

    function drawTank(x, y, w, h, dir, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(dir * Math.PI / 2);

        ctx.fillStyle = color;
        ctx.shadowColor = color + '66';
        ctx.shadowBlur = 15;
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#222';
        ctx.fillRect(-w / 2, -h / 2 - 3, 4, h + 6);
        ctx.fillRect(w / 2 - 4, -h / 2 - 3, 4, h + 6);

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#444';
        ctx.fillRect(9, -2.5, 12, 5);

        ctx.restore();
    }

    // ---------- UI ----------
    function updateUI() {
        scoreDisplay.textContent = score;
        waveDisplay.textContent = wave;
        livesDisplay.textContent = lives;
    }

    // ---------- ДЖОЙСТИК ----------
    const joystickZone = document.getElementById('joystickZone');
    const joystickKnob = document.getElementById('joystickKnob');
    const fireBtn = document.getElementById('fireBtn');

    function handleJoyStart(clientX, clientY) {
        isDragging = true;
        updateJoystick(clientX, clientY);
    }

    function handleJoyMove(clientX, clientY) {
        if (!isDragging) return;
        updateJoystick(clientX, clientY);
    }

    function handleJoyEnd() {
        isDragging = false;
        joyX = 0;
        joyY = 0;
        joystickKnob.style.transform = 'translate(-50%, -50%)';
    }

    function updateJoystick(clientX, clientY) {
        const rect = joystickZone.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const radius = Math.min(rect.width, rect.height) / 2 - 10;

        let dx = clientX - cx;
        let dy = clientY - cy;
        let dist = Math.hypot(dx, dy);

        if (dist > radius) {
            dx = dx / dist * radius;
            dy = dy / dist * radius;
            dist = radius;
        }

        joyX = dx / radius;
        joyY = dy / radius;

        let knobX = (dx / radius) * 40;
        let knobY = (dy / radius) * 40;
        joystickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
    }

    // Мышь
    joystickZone.addEventListener('mousedown', (e) => {
        e.preventDefault();
        handleJoyStart(e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        handleJoyMove(e.clientX, e.clientY);
    });
    document.addEventListener('mouseup', () => {
        if (isDragging) handleJoyEnd();
    });

    // Тач
    joystickZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        handleJoyStart(touch.clientX, touch.clientY);
    }, { passive: false });
    document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.changedTouches[0];
        handleJoyMove(touch.clientX, touch.clientY);
    }, { passive: false });
    document.addEventListener('touchend', () => {
        if (isDragging) handleJoyEnd();
    }, { passive: false });
    document.addEventListener('touchcancel', () => {
        if (isDragging) handleJoyEnd();
    }, { passive: false });

    // Кнопка огня
    fireBtn.addEventListener('mousedown', (e) => { e.preventDefault();
        firePressed = true; });
    fireBtn.addEventListener('mouseup', () => { firePressed = false; });
    fireBtn.addEventListener('mouseleave', () => { firePressed = false; });
    fireBtn.addEventListener('touchstart', (e) => { e.preventDefault();
        firePressed = true; }, { passive: false });
    fireBtn.addEventListener('touchend', (e) => { e.preventDefault();
        firePressed = false; }, { passive: false });
    fireBtn.addEventListener('touchcancel', () => { firePressed = false; });

    // Рестарт
    restartBtn.addEventListener('click', () => {
        initGame();
    });
    restartBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        initGame();
    }, { passive: false });

    // ---------- ЦИКЛ ----------
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ---------- ЗАПУСК ----------
    window.addEventListener('resize', () => {
        resizeCanvas();
    });

    initGame();
    gameLoop();

    // Блокировка скролла
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
</script>
</body>
</html>
